[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typedecide"
version = "0.1.0"
description = "One typed-decision API for interchangeable model backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hsuan Guo" }]
keywords = ["typed-decisions", "structured-output", "classification", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.5.7"]
laya = ["laya==0.3.5"]
semif = ["semif-phase1"]
thisthat = ["thisthat"]
all = ["typesafe-sdk>=0.5.7", "laya==0.3.5", "semif-phase1", "thisthat"]
all-backends = ["typesafe-sdk>=0.5.7", "laya==0.3.5", "semif-phase1", "thisthat"]
dev = ["pytest>=8.0"]

[project.scripts]
typedecide-benchmark = "typedecide.cli:main"

[project.urls]
Homepage = "https://github.com/hsuanguo/typedecide"
Repository = "https://github.com/hsuanguo/typedecide"
Issues = "https://github.com/hsuanguo/typedecide/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typedecide = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
semif-phase1 = { git = "https://github.com/TheoLeeCJ/SemIf", rev = "1f2dea3e25379f9dfc98cb83c324f00ab5deda37" }
thisthat = { git = "https://github.com/FLock-io/this-that-model.git" }
